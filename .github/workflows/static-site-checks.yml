name: Static site checks

on:
  push:
    branches: [main, "stage2/**"]
  pull_request:
    branches: [main]

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          find JS -name "*.js" -type f -print0 | xargs -0 -n1 node --check
      - name: Validate local assets and duplicate HTML IDs
        run: node scripts/check-site.js
